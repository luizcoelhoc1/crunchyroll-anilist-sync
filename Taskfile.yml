version: '3'

vars:
  VERSION: ''
  PUBLISH: 'true'

tasks:
  auth:login:
    desc: Autoriza o Wrangler na sua conta Cloudflare Free
    cmds:
      - task: _auth-env
      - node cloudflare/node_modules/wrangler/bin/wrangler.js login --use-keyring --scopes account:read user:read workers:write workers_scripts:write workers_routes:write --config cloudflare/wrangler.jsonc

  auth:deploy:
    desc: Publica o login AniList no Cloudflare usando o segredo do .env local
    cmds:
      - task: _auth-env
      - python cloudflare/deploy.py

  _auth-env:
    internal: true
    dir: '{{.TASKFILE_DIR}}'
    preconditions:
      - sh: node --version
        msg: Instale Node.js para preparar o Worker Cloudflare.
    cmds:
      - npm --prefix cloudflare ci --no-audit --no-fund

  compile:
    desc: Compila o MSI, cria commit/tag e publica a release no GitHub (PUBLISH=false para build local)
    dir: '{{.TASKFILE_DIR}}'
    env:
      APP_BUILD_VERSION: '{{.VERSION}}'
      APP_PUBLISH: '{{.PUBLISH}}'
    preconditions:
      - sh: python -c "import sys, platform; assert sys.platform == 'win32' and platform.machine() == 'AMD64' and sys.maxsize > 2**32 and (3, 10) <= sys.version_info < (3, 16)"
        msg: 'A compilação requer Windows x64 e Python 3.10 a 3.15 (64 bits) no PATH.'
    cmds:
      - task: _build-env
      - .venv-build/Scripts/python.exe -m pip install --disable-pip-version-check -r requirements-build.txt
      - .venv-build/Scripts/python.exe packaging/build.py

  _build-env:
    internal: true
    dir: '{{.TASKFILE_DIR}}'
    status:
      - python -c "from pathlib import Path; assert Path('.venv-build/Scripts/python.exe').is_file()"
    cmds:
      - python -m venv .venv-build
